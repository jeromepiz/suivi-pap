<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Suivi PAP — Pizzorno QSE</title>
<style>
:root{
  --bg:#14171a; --surface:#1d2226; --surface-2:#262c31; --surface-3:#2f363c;
  --border:#343b41; --text:#f2f4f5; --text-dim:#9aa3aa; --text-faint:#6b747b;
  --accent:#ff7a1a; --accent-dim:#7a3f14;
  --ok:#3fa66b; --ok-dim:#1c3327;
  --bad:#e4483c; --bad-dim:#3a1b19;
  --warn:#e8a93b; --warn-dim:#3a2f13;
  --na:#5a6169; --na-dim:#26292c;
  --radius:14px; --radius-lg:20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font-display: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  overscroll-behavior:none; user-select:none;
  -webkit-user-select:none;
}
input,textarea{user-select:text; -webkit-user-select:text;}
h1,h2,h3,.num,.condensed{font-family:var(--font-display); font-weight:700; letter-spacing:.01em;}
#app{
  max-width:480px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column; position:relative;
  background:var(--bg);
}
.topbar{
  padding-top:calc(10px + var(--safe-t));
  padding:calc(10px + var(--safe-t)) 14px 10px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--bg); z-index:20;
}
.topbar .icon-btn{ background:none; border:none; color:var(--text); font-size:22px; padding:6px; line-height:1; cursor:pointer; }
.topbar .title{ flex:1; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.02em; }
.topbar .sub{ font-size:12px; color:var(--text-dim); font-weight:500; }
.progress-track{ height:4px; background:var(--surface-2); }
.progress-fill{ height:100%; background:var(--accent); transition:width .3s; }

.screen{ display:none; flex:1; flex-direction:column; padding-bottom:calc(20px + var(--safe-b)); }
.screen.active{ display:flex; }
.scroll{ flex:1; overflow-y:auto; padding:16px; }

.field-label{ font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin:18px 0 8px; }
.field-label:first-child{ margin-top:0; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  padding:10px 16px; border-radius:999px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text); font-size:15px; font-weight:600;
  cursor:pointer; min-height:44px; display:flex; align-items:center;
}
.chip.selected{ background:var(--accent); border-color:var(--accent); color:#1a1200; }
.text-input{
  width:100%; padding:14px 16px; border-radius:var(--radius); border:1.5px solid var(--border);
  background:var(--surface); color:var(--text); font-size:17px; font-family:inherit;
}
.text-input:focus{ outline:none; border-color:var(--accent); }
.input-with-mic{ position:relative; }
.input-with-mic .text-input{ padding-right:52px; }
.mic-inline{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:38px; height:38px; border-radius:50%; border:none; background:var(--surface-3);
  color:var(--text); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.mic-inline.on{ background:var(--accent); color:#1a1200; }
.row-2{ display:flex; gap:10px; }
.row-2 > *{ flex:1; }
.hint{ font-size:12.5px; color:var(--text-faint); margin-top:6px; line-height:1.4; }
.datalist-suggest{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.datalist-suggest button{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer;
}

.bottom-bar{
  padding:12px 16px calc(12px + var(--safe-b)); border-top:1px solid var(--border);
  background:var(--bg); position:sticky; bottom:0;
  display:flex; gap:10px;
}
.btn{
  flex:1; padding:15px 16px; border-radius:var(--radius); border:none; font-size:16px; font-weight:700;
  cursor:pointer; font-family:var(--font-body); display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px;
}
.btn-primary{ background:var(--accent); color:#1a1200; }
.btn-primary:disabled{ background:var(--surface-3); color:var(--text-faint); }
.btn-secondary{ background:var(--surface-2); color:var(--text); border:1.5px solid var(--border); }
.btn-ghost{ background:none; color:var(--text-dim); }
.btn-danger{ background:var(--bad-dim); color:#ffb3ac; }

/* Home screen */
.hero{ padding:28px 20px 10px; }
.hero .kicker{ color:var(--accent); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
.hero h1{ font-size:40px; line-height:1.02; margin:6px 0 4px; }
.hero p{ color:var(--text-dim); font-size:15px; margin:0; line-height:1.5; }
.home-actions{ padding:14px 20px; display:flex; flex-direction:column; gap:12px; }
.big-action{
  display:flex; align-items:center; gap:14px; padding:20px; border-radius:var(--radius-lg);
  border:1.5px solid var(--border); background:var(--surface); cursor:pointer;
}
.big-action .ico{ font-size:28px; width:44px; text-align:center; }
.big-action .txt{ flex:1; }
.big-action .txt .t{ font-weight:700; font-size:17px; }
.big-action .txt .d{ font-size:13px; color:var(--text-dim); margin-top:2px; }
.big-action.primary{ background:linear-gradient(135deg, var(--accent), #d95f00); border-color:transparent; }
.big-action.primary .txt .t, .big-action.primary .txt .d{ color:#1a1200; }
.big-action.primary .txt .d{ color:#3a2500; }

.history-list{ padding:0 20px 20px; display:flex; flex-direction:column; gap:8px; }
.history-item{
  display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius); background:var(--surface);
  border:1px solid var(--border); cursor:pointer;
}
.history-item .badge{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px; flex-shrink:0;
}
.history-item .meta{ flex:1; min-width:0; }
.history-item .meta .l1{ font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-item .meta .l2{ font-size:12.5px; color:var(--text-dim); }
.history-item .chev{ color:var(--text-faint); }

/* Section card */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:14px; }
.card h3{ margin:0 0 10px; font-size:19px; }

/* live voice screen */
.live-wrap{ flex:1; display:flex; flex-direction:column; }
.status-strip{ padding:10px 16px; display:flex; align-items:center; gap:10px; }
.status-strip .dot{ width:9px; height:9px; border-radius:50%; background:var(--na); }
.status-strip .dot.live{ background:var(--ok); box-shadow:0 0 0 0 rgba(63,166,107,.6); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(63,166,107,.55);} 70%{box-shadow:0 0 0 10px rgba(63,166,107,0);} 100%{box-shadow:0 0 0 0 rgba(63,166,107,0);} }
.status-strip .txt{ font-size:13px; color:var(--text-dim); flex:1; }
.status-strip .counter{ font-family:var(--font-display); font-weight:700; font-size:15px; }

.transcript-box{
  margin:0 16px 10px; padding:14px 16px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); min-height:52px; font-size:15.5px; color:var(--text-dim); line-height:1.4;
}
.transcript-box.final{ color:var(--text); }
.transcript-box .say{ color:var(--text-faint); font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; display:block; margin-bottom:4px; }

.exceptions-scroll{ flex:1; overflow-y:auto; padding:0 16px; display:flex; flex-direction:column; gap:8px; }
.exceptions-empty{ text-align:center; color:var(--text-faint); padding:30px 20px; font-size:14.5px; line-height:1.6; }
.exceptions-empty .big{ font-size:44px; display:block; margin-bottom:8px; }
.exc-item{ display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--border); }
.exc-item.bad{ background:var(--bad-dim); border-color:#5c2521; }
.exc-item.warn{ background:var(--warn-dim); border-color:#5c4a1f; }
.exc-item .num{ font-size:22px; min-width:30px; }
.exc-item .body{ flex:1; min-width:0; }
.exc-item .body .t1{ font-weight:700; font-size:14.5px; }
.exc-item .body .t2{ font-size:13px; color:var(--text-dim); margin-top:2px; }
.exc-item .body .t3{ font-size:13px; color:var(--text); margin-top:4px; font-style:italic; }
.exc-item .rm{ background:none; border:none; color:var(--text-faint); font-size:20px; cursor:pointer; padding:2px 4px; }

.mic-zone{ padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.mic-btn{
  width:84px; height:84px; border-radius:50%; border:none; background:var(--surface-2);
  border:2px solid var(--border); color:var(--text); font-size:32px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative;
}
.mic-btn.on{ background:var(--accent); border-color:var(--accent); color:#1a1200; box-shadow:0 0 0 0 rgba(255,122,26,.5); animation:micpulse 1.4s infinite; }
@keyframes micpulse{ 0%{box-shadow:0 0 0 0 rgba(255,122,26,.45);} 70%{box-shadow:0 0 0 16px rgba(255,122,26,0);} 100%{box-shadow:0 0 0 0 rgba(255,122,26,0);} }
.mic-caption{ font-size:13px; color:var(--text-dim); text-align:center; }
.mic-row-actions{ display:flex; gap:10px; width:100%; }
.small-btn{ flex:1; padding:11px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; }

/* grid screen */
.section-title{ display:flex; align-items:center; gap:8px; margin:20px 0 10px; }
.section-title:first-child{ margin-top:4px; }
.section-title .sw{ width:10px; height:10px; border-radius:3px; }
.section-title h3{ margin:0; font-size:17px; }
.grid-item{ border-bottom:1px solid var(--border); padding:12px 0; }
.grid-item-top{ display:flex; align-items:center; gap:10px; }
.grid-item-top .n{ font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--text-faint); width:26px; }
.grid-item-top .label{ flex:1; font-size:14.5px; font-weight:600; line-height:1.3; }
.grid-item-top .info-btn{ background:none; border:1px solid var(--border); color:var(--text-faint); border-radius:50%; width:22px; height:22px; font-size:12px; cursor:pointer; flex-shrink:0; }
.role-toggles{ display:flex; gap:8px; margin-top:10px; }
.role-toggle{ flex:1; text-align:center; }
.role-toggle .rl{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; font-weight:700; }
.role-toggle.inactive{ opacity:.25; pointer-events:none; }
.val-btn{
  width:100%; padding:9px 4px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface-2);
  color:var(--text-dim); font-weight:700; font-size:13px; cursor:pointer; font-family:var(--font-display);
}
.val-btn.v-ok{ background:var(--ok-dim); border-color:var(--ok); color:var(--ok); }
.val-btn.v-bad{ background:var(--bad-dim); border-color:var(--bad); color:#ff8b82; }
.val-btn.v-na{ background:var(--na-dim); border-color:var(--na); color:var(--text-faint); }
.val-btn.v-bp{ background:var(--warn-dim); border-color:var(--warn); color:var(--warn); }
.comment-line{ margin-top:8px; }
.comment-line input{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13.5px; }

/* signature */
.sig-card{ margin-bottom:16px; }
.sig-card .sig-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.sig-card .sig-head .name{ font-weight:700; font-size:15px; }
.sig-card .sig-head .who{ font-size:12px; color:var(--text-dim); }
canvas.sigpad{ width:100%; height:130px; background:#fff; border-radius:10px; display:block; touch-action:none; }
.sig-actions{ display:flex; justify-content:space-between; margin-top:6px; }
.sig-actions .st{ font-size:12px; color:var(--text-faint); }
.sig-actions button{ background:none; border:none; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }

/* recap */
.recap-block{ margin-bottom:16px; }
.recap-block h4{ font-family:var(--font-display); font-size:16px; margin:0 0 8px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
.kv{ display:flex; font-size:14px; padding:4px 0; border-bottom:1px dashed var(--border); }
.kv .k{ color:var(--text-dim); width:42%; }
.kv .v{ flex:1; font-weight:600; }
.recap-list-item{ font-size:13.5px; padding:8px 0; border-bottom:1px dashed var(--border); }
.recap-list-item b{ color:var(--bad); }
.recap-list-item.bp b{ color:var(--warn); }
.score-pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; margin-left:6px; }

/* toast */
#toast{
  position:fixed; left:50%; bottom:120px; transform:translate(-50%,20px); background:var(--surface-3);
  color:var(--text); padding:10px 18px; border-radius:999px; font-size:13.5px; opacity:0; pointer-events:none;
  transition:all .25s; z-index:100; max-width:86%; text-align:center; border:1px solid var(--border);
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* modal */
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:none; align-items:flex-end; justify-content:center; }
.modal-backdrop.show{ display:flex; }
.modal-sheet{ background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px 20px calc(20px + var(--safe-b)); max-height:80vh; overflow-y:auto; }
.modal-sheet h3{ margin:0 0 10px; }
.modal-sheet p{ color:var(--text-dim); font-size:14.5px; line-height:1.6; }
.modal-close{ display:block; width:100%; margin-top:14px; padding:13px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-weight:700; }

.cmd-example{ background:var(--surface-2); border-radius:10px; padding:10px 12px; margin:8px 0; font-size:13.5px; }
.cmd-example code{ color:var(--accent); font-weight:700; }

textarea.dictate{ width:100%; min-height:110px; padding:14px; border-radius:var(--radius); border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-size:15.5px; font-family:inherit; resize:vertical; }

.weather-row{ display:flex; gap:8px; }
.weather-row .chip{ flex:1; flex-direction:column; gap:2px; font-size:12px; padding:10px 4px; }
.weather-row .chip .ic{ font-size:20px; }

/* ===================== Fac-similé imprimable (FE 28 QSE) ===================== */
.paper-wrap{ flex:1; overflow:auto; background:#0b0d0f; padding:18px 0; -webkit-overflow-scrolling:touch; }
.paper-zoom-hint{ text-align:center; color:var(--text-faint); font-size:12px; margin-bottom:10px; }
.paper{
  width:794px; min-height:1123px; margin:0 auto 24px; background:#fff; color:#111;
  font-family:Arial,Helvetica,sans-serif; font-size:11px; padding:22px 26px 40px; position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,.5); box-sizing:border-box;
}
.paper table{ border-collapse:collapse; width:100%; }
.paper td, .paper th{ border:1px solid #000; padding:3px 5px; vertical-align:middle; }
.pp-head{ display:flex; align-items:stretch; border:1px solid #000; margin-bottom:8px; }
.pp-head .logo{ flex:0 0 150px; display:flex; flex-direction:column; justify-content:center; align-items:center; border-right:1px solid #000; padding:8px; }
.pp-head .logo .b1{ color:#0a4fa0; font-weight:800; font-size:19px; letter-spacing:.02em; }
.pp-head .logo .b2{ color:#0a4fa0; font-size:7px; letter-spacing:.25em; margin-top:2px; }
.pp-head .mid{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:700; font-size:14px; padding:8px; text-transform:uppercase; }
.pp-head .right{ flex:0 0 170px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; font-weight:600; border-left:1px solid #000; padding:8px; }
.pp-banner{ border:1px solid #000; padding:6px 10px; font-weight:700; font-style:italic; font-size:10.5px; text-align:center; margin-bottom:0; }
.pp-info-table td{ font-size:11px; }
.pp-info-table .lbl{ font-weight:700; width:34%; background:#fff; }
.pp-legend{ font-size:9.5px; line-height:1.5; }
.pp-legend b{ display:block; margin-bottom:2px; }
.pp-meteo{ display:flex; gap:14px; align-items:center; }
.pp-meteo .m{ display:flex; align-items:center; gap:4px; font-size:15px; }
.pp-meteo .box{ width:11px; height:11px; border:1.3px solid #000; display:inline-block; text-align:center; line-height:10px; font-size:9px; }
.pp-sig-row td{ height:70px; width:25%; vertical-align:top; font-size:9.5px; }
.pp-sig-row .sigimg{ display:block; max-width:100%; max-height:46px; margin-top:4px; }
.pp-block-title{ background:#d9d9d9; font-weight:700; padding:5px 8px; border:1px solid #000; font-size:11px; }
.pp-block-body{ border:1px solid #000; border-top:none; min-height:46px; padding:6px 8px; font-size:10.5px; white-space:pre-wrap; }
.pp-actions-row{ display:flex; border:1px solid #000; border-top:none; }
.pp-actions-row .resp{ flex:0 0 30%; border-right:1px solid #000; padding:6px 8px; font-size:9.5px; }
.pp-actions-row .resp .sigimg{ display:block; max-width:100%; max-height:40px; margin-top:6px; }
.pp-actions-row .txt{ flex:1; padding:6px 8px; font-size:10.5px; white-space:pre-wrap; }
.pp-footer{ position:absolute; left:26px; right:26px; bottom:14px; display:flex; justify-content:space-between; font-size:8.5px; color:#333; }
.pp-verso-title{ text-align:center; font-weight:700; font-size:11px; margin:2px 0 8px; }
.pp-sec-table{ font-size:8px; margin-bottom:10px; }
.pp-sec-table th{ background:#d9d9d9; font-size:8px; text-align:center; }
.pp-sec-table td{ padding:2px 3px; }
.pp-sec-table .lblcol{ text-align:left; width:26%; font-size:8px; }
.pp-sec-table .grpname{ text-align:center; font-weight:700; }
.pp-sec-table .cbx{ width:16px; text-align:center; font-weight:800; }
.pp-sec-table .cmt{ width:16%; font-size:7.5px; text-align:left; }
.pp-cat-label{ writing-mode:vertical-rl; transform:rotate(180deg); font-weight:800; text-align:center; background:#d9d9d9; }

@media print{
  body{ background:#fff; }
  #app{ max-width:none; }
  .no-print{ display:none !important; }
  .paper-wrap{ background:#fff; padding:0; overflow:visible; }
  .paper{ box-shadow:none; margin:0 auto; width:100%; }
  .print-page{ page-break-after:always; }
  .print-page:last-child{ page-break-after:auto; }
  @page{ size:A4 portrait; margin:8mm; }
}

/* ===================== Mots-clés personnalisés ===================== */
.kw-row{ border-bottom:1px solid var(--border); padding:12px 0; }
.kw-row-top{ display:flex; align-items:baseline; gap:8px; }
.kw-row-top .n{ font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--text-faint); width:24px; flex-shrink:0; }
.kw-row-top .label{ font-size:14px; font-weight:700; }
.kw-default{ font-size:12px; color:var(--text-faint); margin:4px 0 8px 32px; line-height:1.5; }
.kw-input-row{ display:flex; gap:8px; margin-left:32px; }
.kw-input-row input{ flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 10px; color:var(--text); font-size:13.5px; }
.kw-input-row .mic-inline{ position:static; width:36px; height:36px; flex-shrink:0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<!-- ==========================================================================
     SYNCHRONISATION DES MOTS-CLÉS ENTRE TOUS LES TÉLÉPHONES (Firebase, gratuit)
     ==========================================================================
     Par défaut, "Mes mots-clés" reste local à cet appareil (comme avant).
     Pour que les formulations ajoutées par un évaluateur soient visibles par
     toute l'équipe, sur tous les téléphones :
       1. Allez sur https://console.firebase.google.com → créez un projet (gratuit).
       2. Menu de gauche → "Realtime Database" → "Créer une base de données".
          Choisissez une région, puis démarrez en mode "Test".
       3. Onglet "Règles" de la Realtime Database, remplacez par :
             { "rules": { "keywords": { ".read": true, ".write": true } } }

const NUM_WORDS = {

function wordsToNumber(str){
  // essaie de trouver un nombre écrit en toutes lettres dans la chaîne
  const keys = Object.keys(NUM_WORDS).sort((a,b)=>b.length-a.length);

function matchItemByText(text){
  const tokens = norm(text).split(' ').filter(w=>w && !STOPWORDS.has(w));
  if(!tokens.length) return null;
  let best=null, bestScore=0, second=0;
  ALL_ITEMS.forEach(([n,label])=>{
    let itemBest=0;
    const custom = (customKeywords[n]||'').split(',').map(s=>s.trim()).filter(Boolean);
    // les formulations personnalisées de l'utilisateur ont un léger bonus de priorité
    const phrases = custom.map(p=>({p, bonus:0.12}))
      .concat((ITEM_KEYWORDS[n]||[]).map(p=>({p, bonus:0})))
      .concat([{p:label, bonus:0}]);
    phrases.forEach(({p,bonus})=>{
      const pTokens = norm(p).split(' ').filter(w=>w && !STOPWORDS.has(w));
      if(!pTokens.length) return;
      const matched = pTokens.filter(w=>tokens.includes(w)).length;
      const score = Math.min(1, matched/pTokens.length + bonus);
      if(score>itemBest) itemBest=score;
    });
    if(itemBest>bestScore){ second=bestScore; bestScore=itemBest; best=n; }
    else if(itemBest>second){ second=itemBest; }
  });
  if(best && bestScore>=0.5 && (bestScore-second)>=0.15) return best;
  return null;
}

/* =========================================================================
   MOTEUR VOCAL — reconnaissance continue + interprétation de commandes
   Grammaire : "point <N> <role> <valeur>" [+ "commentaire ..."]
   Commandes globales : "tout conforme", "annule le dernier", "suivant"...
   ========================================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;
let listeningIntended = false; // permet le redémarrage auto si coupure

function initRecognizer(){
  if(!SR) return null;
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = onSpeechResult;
  r.onerror = (e)=>{
    if(e.error==='no-speech' || e.error==='aborted') return;
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      listeningIntended = false;
      setMicUI(false);
      toast("Micro refusé — autorisez l'accès au micro pour ce site.");
      return;
    }
    if(e.error==='network'){
      listeningIntended = false;
      setMicUI(false);
      toast('Pas de connexion internet : la reconnaissance vocale est indisponible. Utilisez la grille tactile.');
      return;
    }
    // toute autre erreur : on prévient plutôt que d'échouer silencieusement
    toast('Micro interrompu ('+e.error+'). Ré-appuyez sur le micro pour reprendre.');
  };
  r.onend = ()=>{
    listening = false;
    if(listeningIntended){
      try{ r.start(); listening = true; }catch(e){ setTimeout(()=>{ try{ r.start(); listening=true; }catch(e2){} }, 300); }
    } else {
      setMicUI(false);
    }
  };
  return r;
}

function toggleMic(){
  if(!SR){
    openModal(`<h3>Reconnaissance vocale indisponible</h3>
      <p>Ce navigateur ne permet pas la commande vocale continue (fréquent sur iPhone/Safari).
      Utilisez les boutons 🎙️ à côté de chaque champ texte : ils déclenchent le clavier vocal du téléphone.
      Pour le tableau des 31 points, utilisez la grille tactile ci-dessous.</p>
      <button class="modal-close" onclick="closeModal()">Compris</button>`);
    return;
  }
  if(!recognizer) recognizer = initRecognizer();
  if(listening){
    listeningIntended = false;
    try{ recognizer.stop(); }catch(e){}
    setMicUI(false);
  } else {
    try{
      recognizer.start(); listening = true; listeningIntended = true;
      setMicUI(true);
      vibrate(30);
    }catch(e){ /* déjà démarré */ }
  }
}
function setMicUI(on){
  const btn = document.getElementById('liveMicBtn');
  const dot = document.getElementById('liveDot');
  const txt = document.getElementById('liveStatusTxt');
  if(btn){ btn.classList.toggle('on', on); btn.textContent = on ? '🎙️' : '🎤'; }
  if(dot) dot.classList.toggle('live', on);
  if(txt) txt.textContent = on ? "Écoute en cours…" : "Micro coupé — appuyez pour parler";
}

function onSpeechResult(event){
  let interim = '', final = '';
  for(let i=event.resultIndex; i<event.results.length; i++){
    const t = event.results[i][0].transcript;
    if(event.results[i].isFinal) final += t; else interim += t;
  }
  const box = document.getElementById('transcriptBox');
  if(box){
    if(final){ box.classList.add('final'); box.textContent = final; }
    else if(interim){ box.classList.remove('final'); box.textContent = interim; }
  }
  if(final){ handleVoiceCommand(final); }
}

function handleVoiceCommand(raw){
  const t = norm(raw);
  if(!t) return;

  // Commande : commentaire libre rattaché au dernier point signalé
  let m = t.match(/^commentaire\s+(.+)/);
  if(m && lastFlagKey){
    const {n, role} = lastFlagKey;
    R.items[n].comment = (R.items[n].comment ? R.items[n].comment+' — ' : '') + m[1];
    const exc = R.exceptions.find(e=>e.n===n && e.role===role);
    if(exc) exc.comment = R.items[n].comment;
    toast('Commentaire ajouté au point '+n);
    speak('Commentaire ajouté.');
    refreshLiveScreen();
    return;
  }

  // Commandes globales
  if(/^(tout|tous)\s+(conforme|ok|bon|nickel)/.test(t) || /^rien\s+a\s+signaler/.test(t)){
    resetAllToConform();
    toast('Tout remis à conforme.');
    speak('Tout est remis à conforme.');
    refreshLiveScreen();
    return;
  }
  if(/^(annule|supprime|efface)\s*(le\s+)?(dernier|derniere)/.test(t)){
    undoLastException();
    return;
  }
  if(/^(suivant|termine|c est termine|fin du suivi|fin de la collecte|passer au debrief)/.test(t)){
    speak('Suivi terminé, passage au débrief.');
    goTo('debrief');
    return;
  }
  if(/^(pause|stop|coupe le micro|arrete l ecoute)/.test(t)){
    toggleMic();
    return;
  }
  if(/^(aide|comment ca marche|quelles commandes)/.test(t)){
    showVoiceHelp();
    return;
  }

  // Commande de point : "<numéro ou description du point> <role> <valeur...>"
  m = t.match(/^(?:point|numero|item|numero de point)?\s*(\d{1,2}|.+?)\s+(conducteur|chauffeur|equipier\s*1|equipier\s*un|premier\s*equipier|ec\s*1|equipier\s*2|equipier\s*deux|deuxieme\s*equipier|ec\s*2|tous|toute\s*l\s*equipe|equipage|equipe)\s+(.+)$/);
  if(m){
    let n = parseInt(m[1],10);
    if(isNaN(n)) n = wordsToNumber(m[1]);
    if(!n) n = matchItemByText(m[1]);
    const roleRaw = m[2];
    const valueRaw = m[3];
    if(!n || !ITEM_MAP[n]){
      const guess = matchItemByText(t); // dernière tentative sur la phrase entière
      if(guess){
        toast("Point non identifié avec certitude. Vous vouliez peut-être « "+guess+". "+ITEM_MAP[guess][1]+" » ? Redites avec « point "+guess+" ».");
        speak("Je pense au point "+guess+", "+ITEM_MAP[guess][1]+". Redites avec le numéro pour confirmer.");
      } else {
        toast("Point non reconnu : « "+raw+" ». Reformulez ou dites le numéro.");
        speak("Je n'ai pas identifié le point. Reformulez ou dites le numéro.");
      }
      vibrate([40,60,40]);
      return;
    }
    let roles = [];
    if(/^conducteur|chauffeur$/.test(roleRaw)) roles=['conducteur'];
    else if(/equipier\s*1|equipier\s*un|premier\s*equipier|ec\s*1/.test(roleRaw)) roles=['ec1'];
    else if(/equipier\s*2|equipier\s*deux|deuxieme\s*equipier|ec\s*2/.test(roleRaw)) roles=['ec2'];
    else roles=['conducteur','ec1','ec2'];
    // filtrer les rôles inactifs (équipier non renseigné)
    roles = roles.filter(r => (r==='conducteur' || (r==='ec1'? !!R.ec1 : !!R.ec2)) && !isForcedNA(n, r));
    if(!roles.length){
      toast("Ce point n'est pas applicable à ce rôle (case grisée d'origine).");
      speak("Ce point n'est pas applicable à ce rôle.");
      return;
    }
    applyVoiceValue(n, roles, valueRaw, raw);
    return;
  }

  toast("Non compris : « "+raw+" ». Dites par exemple « point 4 conducteur non ».");
  vibrate([40,60,40]);
}

function applyVoiceValue(n, roles, valueRaw, rawFull){
  const type = itemType(n);
  let value = null;
  if(type==='bin'){
    if(/non\s*applicable|^na$|\bna\b/.test(valueRaw)) value='NA';
    else if(/^non|non\s*conforme/.test(valueRaw)) value='NON';
    else if(/oui|conforme/.test(valueRaw)) value='OUI';
  } else {
    if(/bonne\s*pratique|\bbp\b/.test(valueRaw)) value='BP';
    else if(/non\s*applicable|\bna\b/.test(valueRaw)) value='NA';
    else if(/\b3\b|trois/.test(valueRaw)) value=3;
    else if(/\b2\b|deux/.test(valueRaw)) value=2;
    else if(/\b1\b|^un\b/.test(valueRaw)) value=1;
  }
  if(value===null){
    toast("Valeur non reconnue pour le point "+n+" : « "+rawFull+" »");
    speak("Valeur non comprise.");
    return;
  }
  roles.forEach(role=>{
    R.items[n][role] = value;
    logException(n, role, value);
  });
  lastFlagKey = {n, role: roles[roles.length-1]};
  const roleLabel = roles.length===3 ? 'toute l\'équipe' : ROLES.find(r=>r.key===roles[0]).label;
  const valLabel = String(value)==='OUI'?'conforme': String(value)==='NON'?'non conforme': value;
  toast('Point '+n+' — '+roleLabel+' — '+valLabel);
  speak('Point '+n+', '+roleLabel+', '+valLabel+'.');
  vibrate(30);
  refreshLiveScreen();
}

function logException(n, role, value){
  const isDefault = value === defaultValueFor(n, role);
  // retire une éventuelle entrée existante pour (n, role)
  R.exceptions = R.exceptions.filter(e=>!(e.n===n && e.role===role));
  if(!isDefault){
    R.exceptions.push({n, role, value, comment:'', ts:Date.now()});
  }
}
function undoLastException(){
  if(!R.exceptions.length){ toast('Aucune anomalie à annuler.'); speak('Rien à annuler.'); return; }
  const last = R.exceptions.pop();
  R.items[last.n][last.role] = defaultValueFor(last.n, last.role);
  R.items[last.n].comment = '';
  toast('Point '+last.n+' remis à conforme.');
  speak('Dernière anomalie annulée.');
  refreshLiveScreen();
}
function resetAllToConform(){
  ALL_ITEMS.forEach(([n])=>{
    ROLES.forEach(r=>{ R.items[n][r.key] = defaultValueFor(n, r.key); });
    R.items[n].comment='';
  });
  R.exceptions = [];
}

/* =========================================================================
   DICTÉE PONCTUELLE POUR CHAMPS TEXTE (mic inline)
   Utilise une reconnaissance ponctuelle (non continue) — fonctionne aussi
   pour dicter un nom, un secteur, le débrief, les actions...
   ========================================================================= */
function dictateInto(inputId, {append=false, capitalize=false}={}){
  if(!SR){ toast('Dictée vocale indisponible sur ce navigateur — utilisez le clavier (bouton micro du clavier iOS possible).'); return; }
  const el = document.getElementById(inputId);
  const btn = document.getElementById('mic_'+inputId);
  const launch = ()=>{
    const r = new SR();
    r.lang='fr-FR'; r.continuous=false; r.interimResults=true;
    if(btn) btn.classList.add('on');
    r.onresult = (ev)=>{
      let t='';
      for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
      if(capitalize) t = t.charAt(0).toUpperCase()+t.slice(1);
      el.value = append && el.dataset.base ? (el.dataset.base+' '+t) : t;
    };
    r.onstart = ()=>{ el.dataset.base = append ? el.value : ''; };
    r.onerror = (e)=>{
      if(btn) btn.classList.remove('on');
      if(e.error==='not-allowed' || e.error==='service-not-allowed') toast("Micro refusé — autorisez l'accès au micro.");
      else if(e.error==='network') toast('Pas de connexion internet : la dictée vocale est indisponible.');
      else if(e.error!=='no-speech' && e.error!=='aborted') toast('Dictée interrompue ('+e.error+'), réessayez.');
    };
    r.onend = ()=>{
      if(btn) btn.classList.remove('on');
      el.dispatchEvent(new Event('input'));
      vibrate(20);
    };
    try{ r.start(); }
    catch(err){
      if(btn) btn.classList.remove('on');
      // le micro était probablement encore occupé par l'écoute continue : on réessaie une fois
      setTimeout(()=>{ try{ r.start(); if(btn) btn.classList.add('on'); }catch(e2){ toast('Micro occupé, réessayez.'); } }, 300);
    }
  };
  // libère le micro continu s'il est en train d'écouter, avant de lancer la dictée ponctuelle
  if(listening){
    listeningIntended = false;
    try{ recognizer && recognizer.stop(); }catch(e){}
    setMicUI(false);
    setTimeout(launch, 250);
  } else {
    launch();
  }
}

   ========================================================================= */
const sigPads = {};
function setupSigCanvas(canvas){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const prevData = canvas.toDataURL ? canvas.toDataURL() : null;
    canvas.width = rect.width*ratio; canvas.height = rect.height*ratio;
    ctx.scale(ratio, ratio);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,rect.width,rect.height);
    ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#14171a';
  }
  resize();
  let drawing=false, lastX=0, lastY=0;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return [p.clientX-rect.left, p.clientY-rect.top];
  }
  function start(e){ e.preventDefault(); drawing=true; [lastX,lastY]=pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const [x,y]=pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    [lastX,lastY]=[x,y];
    canvas.dataset.signed='1';
  }
  function end(e){ drawing=false; saveSignature(canvas.id); }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  sigPads[canvas.id] = canvas;
}
function clearSig(role){
  const canvas = document.getElementById('sig_'+role);
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore();
  canvas.dataset.signed='';
  R.signatures[role] = null;
  updateSigStatus(role);
}
function saveSignature(canvasId){
  const role = canvasId.replace('sig_','');
  const canvas = document.getElementById(canvasId);
  R.signatures[role] = canvas.dataset.signed ? canvas.toDataURL('image/png') : null;
  updateSigStatus(role);
}
function updateSigStatus(role){
  const el = document.getElementById('sigstatus_'+role);
  if(el) el.textContent = R.signatures[role] ? '✓ Signé' : 'En attente';
}

const SCREEN_ORDER = ['setup','live','grid','debrief','signatures','recap'];
function progressPct(){
  const idx = SCREEN_ORDER.indexOf(currentScreen);

/* ---------- Écran maintenu allumé pendant le suivi ---------- */
let wakeLock = null;
let wakeLockWanted = false;
let wakeLockUnsupportedWarned = false;
async function requestWakeLock(){
  wakeLockWanted = true;
  if(!('wakeLock' in navigator)){
    if(!wakeLockUnsupportedWarned){
      wakeLockUnsupportedWarned = true;
      toast("Ce navigateur ne permet pas de garder l'écran allumé automatiquement — augmentez la mise en veille dans les réglages du téléphone.", 4500);
    }
    return;
  }
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch(e){ /* refusé silencieusement (ex: batterie faible) — pas bloquant */ }
}
function releaseWakeLock(){
  wakeLockWanted = false;
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && wakeLockWanted && !wakeLock){
    requestWakeLock();
  }
});

function goTo(screen){
  // libère le micro continu si on quitte l'écran de suivi vocal
  if(currentScreen==='live' && screen!=='live' && listening){
    listeningIntended = false;
    try{ recognizer && recognizer.stop(); }catch(e){}
  }
  // l'écran reste allumé pendant tout le déroulé du suivi (du démarrage au récap)
  if(screen==='home' || screen==='recap'){ releaseWakeLock(); }
  currentScreen = screen;
  render();
  const scroller = document.querySelector('.scroll, .exceptions-scroll');
  if(scroller) scroller.scrollTop = 0;
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById('app');
  if(currentScreen==='home') return renderHome(app);
  if(currentScreen==='setup') return renderSetup(app);
  if(currentScreen==='live') return renderLive(app);
  if(currentScreen==='grid') return renderGrid(app);
  if(currentScreen==='debrief') return renderDebrief(app);
  if(currentScreen==='signatures') return renderSignatures(app);
  if(currentScreen==='recap') return renderRecap(app);
  if(currentScreen==='history') return renderHistory(app);
  if(currentScreen==='print') return renderPrint(app);
  if(currentScreen==='keywords') return renderKeywords(app);
}

function renderExceptionList(){
  if(!R.exceptions.length){

    const item = ITEM_MAP[e.n];
    const roleLabel = ROLES.find(r=>r.key===e.role).label;
    const isBad = itemType(e.n)==='bin' ? e.value==='NON' : (e.value===1 || e.value===2);
    const cls = isBad ? 'bad' : 'warn';
    const valLabel = itemType(e.n)==='bin' ? (e.value==='NON'?'Non conforme':e.value) : (e.value==='BP'?'Bonne pratique':'Note '+e.value);
    return `<div class="exc-item ${cls}">

}
function escHtml(s){ return (s||'').replace(/</g,'&lt;'); }
function removeException(n, role){
  R.items[n][role] = defaultValueFor(n, role);
  R.items[n].comment='';
  R.exceptions = R.exceptions.filter(e=>!(e.n===n && e.role===role));

}

/* ---------- ÉCRAN · GRILLE TACTILE (secours / correction) ---------- */
function gridSectionHtml(title, items, colorVar, sectionKey){
  return `<div class="section-title"><div class="sw" style="background:${colorVar}"></div><h3>${title}</h3></div>` +
    items.map(([n,label])=>gridItemHtml(n,label)).join('');
}
function gridItemHtml(n, label){
  const type = itemType(n);
  const roles = ROLES.map(r=>{
    const locked = isForcedNA(n, r.key);
    const active = !locked && (r.key==='conducteur' || (r.key==='ec1'?!!R.ec1:!!R.ec2));
    const val = R.items[n][r.key];
    const vClass = type==='bin'
      ? (val==='OUI'?'v-ok':val==='NON'?'v-bad':'v-na')
      : (val==='BP'?'v-bp':val===3?'v-ok':val==='NA'?'v-na':'v-bad');
    const clickable = active ? `onclick="cycleValue(${n},'${r.key}')"` : '';
    return `<div class="role-toggle ${active?'':'inactive'}" ${locked?'title="Non applicable pour ce rôle"':''}>
        <div class="rl">${r.short}${locked?' 🔒':''}</div>
        <button class="val-btn ${vClass}" ${clickable}>${val}</button>
      </div>`;
  }).join('');
  return `<div class="grid-item">
    <div class="grid-item-top">
      <div class="n">${n}</div>
      <div class="label">${label}</div>
      <button class="info-btn" onclick="showItemInfo(${n})">i</button>
    </div>
    <div class="role-toggles">${roles}</div>
    ${(R.exceptions.find(e=>e.n===n)) ? `<div class="comment-line"><input placeholder="Commentaire…" value="${escAttr(R.items[n].comment)}" oninput="setItemComment(${n}, this.value)"></div>` : ''}
  </div>`;
}
function cycleValue(n, role){
  if(isForcedNA(n, role)) return; // case verrouillée sur N.A. (non applicable à ce rôle)
  const type = itemType(n);
  const cur = R.items[n][role];
  let next;
  if(type==='bin'){ next = cur==='OUI' ? 'NON' : cur==='NON' ? 'NA' : 'OUI'; }
  else { next = cur==='BP' ? 3 : cur===3 ? 2 : cur===2 ? 1 : cur===1 ? 'NA' : 'BP'; }
  R.items[n][role] = next;
  logException(n, role, next);
  lastFlagKey = {n, role};
  vibrate(20);
  renderGrid(document.getElementById('app'));
}
function setItemComment(n, val){
  R.items[n].comment = val;
  const exc = R.exceptions.find(e=>e.n===n);
  if(exc) exc.comment = val;
}
function showItemInfo(n){
  const item = ITEM_MAP[n];
  const locked = FORCED_NA[n];
  const lockedTxt = locked ? `<p style="color:var(--warn); font-size:13px;">🔒 Non applicable pour : ${locked.map(r=>ROLES.find(x=>x.key===r).label).join(', ')} — grisé d'origine dans la fiche FE 28 QSE.</p>` : '';
  openModal(`<h3>${n}. ${item[1]}</h3><p>${item[2]}</p>${lockedTxt}<button class="modal-close" onclick="closeModal()">Fermer</button>`);
}

function recapText(){
  const lines = [];
  lines.push('SUIVI DE PRESTATION — COLLECTE PAP (FE 28 QSE)');
  lines.push('Date : '+R.date+'   Horaire : '+R.heureDebut+' - '+R.heureFin);
  lines.push('Secteur : '+R.secteur+'   Déchet : '+R.natureDechet+'   N°Parc : '+R.nParc);
  lines.push('Conducteur : '+R.conducteur+(R.ec1?'   EC1 : '+R.ec1:'')+(R.ec2?'   EC2 : '+R.ec2:''));
  lines.push('Suivi assuré par : '+R.evaluateur);
  lines.push('');
  const nonConformSec = R.exceptions.filter(e=>itemType(e.n)==='bin');
  const gradeIssues = R.exceptions.filter(e=>itemType(e.n)==='grade');
  lines.push('ÉCARTS SÉCURITÉ : '+(nonConformSec.length? '' : 'aucun'));
  nonConformSec.forEach(e=> lines.push('- ('+e.n+') '+ITEM_MAP[e.n][1]+' — '+ROLES.find(r=>r.key===e.role).label+(e.comment?' : '+e.comment:'')));
  lines.push('');
  lines.push('QUALITÉ / ENVIRONNEMENT : '+(gradeIssues.length? '' : 'rien à signaler'));
  gradeIssues.forEach(e=> lines.push('- ('+e.n+') '+ITEM_MAP[e.n][1]+' — '+ROLES.find(r=>r.key===e.role).label+' : '+(e.value==='BP'?'BP':'note '+e.value)+(e.comment?' : '+e.comment:'')));
  lines.push('');

  lines.push(R.debrief || '—');
  lines.push('');
  lines.push('ACTIONS :');
  lines.push(R.actions || '—');
  return lines.join('\n');
}

/* =========================================================================
   GÉNÉRATION PDF + ENVOI PAR EMAIL (relais Google Apps Script)
   ========================================================================= */
async function generateReportPdfDataUri(onProgress){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    throw new Error("Les bibliothèques PDF ne sont pas chargées (vérifiez la connexion et rechargez la page).");
  }
  const host = document.createElement('div');
  host.style.position='fixed'; host.style.left='-99999px'; host.style.top='0'; host.style.pointerEvents='none';
  host.innerHTML = buildPrintPages();
  document.body.appendChild(host);
  try{
    const pageEls = host.querySelectorAll('.paper');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4', orientation:'portrait' });
    for(let i=0;i<pageEls.length;i++){
      if(onProgress) onProgress(i+1, pageEls.length);
      const canvas = await html2canvas(pageEls[i], { scale:2, backgroundColor:'#ffffff', useCORS:true });
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      if(i>0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, pageH);
    }
    return pdf.output('datauristring');
  } finally {
    document.body.removeChild(host);
  }
}
function promptEmailRecipient(){
  return new Promise((resolve)=>{
    const saved = localStorage.getItem('lastEmailTo') || EMAIL_CFG.defaultRecipients || '';
    window.__emailPromptResolve = resolve;
    openModal(`<h3>Envoyer le rapport par email</h3>
      <p style="font-size:13px; color:var(--text-dim);">Une ou plusieurs adresses, séparées par une virgule. L'email part sans passer par la messagerie du téléphone.</p>
      <input class="text-input" id="emailToInput" placeholder="nom@entreprise.fr" value="${escAttr(saved)}" style="margin-bottom:14px;">
      <button class="btn btn-primary" style="width:100%; margin-bottom:8px;" onclick="resolveEmailPrompt()">Envoyer</button>
      <button class="modal-close" onclick="resolveEmailPrompt(true)">Annuler</button>`);
  });
}
function resolveEmailPrompt(cancelled){
  const el = document.getElementById('emailToInput');
  const val = (!cancelled && el) ? el.value.trim() : '';
  closeModal();
  if(window.__emailPromptResolve){ window.__emailPromptResolve(val || null); window.__emailPromptResolve=null; }
}
async function sendReportByEmail(){
  if(!EMAIL_ENABLED){
    openModal(`<h3>Envoi par email non configuré</h3>
      <p>Cette fonction nécessite un petit relais gratuit (Google Apps Script) à déployer une fois pour toute l'équipe. Demandez à Claude « donne-moi le code Apps Script pour l'envoi d'email » pour l'obtenir, puis renseignez son adresse dans le fichier index.html (bloc EMAIL_CONFIG en haut du fichier).</p>
      <button class="modal-close" onclick="closeModal()">Compris</button>`);
    return;
  }
  const to = await promptEmailRecipient();
  if(!to) return;
  try{ localStorage.setItem('lastEmailTo', to); }catch(e){}
  toast('Génération du PDF…', 15000);
  try{
    const dataUri = await generateReportPdfDataUri((p,total)=>toast('Génération du PDF… page '+p+'/'+total, 15000));
    const base64 = dataUri.split(',')[1];
    toast('Envoi de l\'email…', 20000);
    const resp = await fetch(EMAIL_CFG.endpointUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // évite le préflight CORS que Apps Script gère mal
      body: JSON.stringify({
        secret: EMAIL_CFG.sharedSecret,
        to,
        subject: 'Suivi PAP — '+(R.conducteur||'')+' — '+R.date,
        body: 'Rapport de suivi de prestation collecte PAP en pièce jointe.\n\nSecteur : '+R.secteur+'\nDate : '+R.date+'\nÉvaluateur : '+R.evaluateur,
        filename: 'suivi_pap_'+(R.date||'').replace(/\//g,'-')+'.pdf',
        pdfBase64: base64,
      }),
    });
    let j = {};
    try{ j = await resp.json(); }catch(e){}
    if(j && j.ok){ toast('Email envoyé à '+to+' ✅', 3500); }
    else{ toast("Échec de l'envoi"+(j&&j.error?(' : '+j.error):'')+'. Réessayez.', 4500); }
  }catch(e){
    console.error(e);
    toast("Échec de l'envoi — vérifiez la connexion et réessayez.", 4000);
  }
}

/* ---------- ÉCRAN · MES MOTS-CLÉS (correspondances personnalisées) ---------- */
let kwDraft = null; // copie de travail avant enregistrement
function renderKeywords(app){
  if(!kwDraft) kwDraft = {...customKeywords};
  const syncBadge = FIREBASE_ENABLED
    ? `<div class="chip" style="background:var(--ok-dim); border-color:var(--ok); color:var(--ok); margin-bottom:14px;">🔗 Partagé avec toute l'équipe</div>`
    : `<div class="chip" style="background:var(--na-dim); border-color:var(--na); color:var(--text-dim); margin-bottom:14px;">📴 Local à cet appareil uniquement</div>`;
  app.innerHTML = `
    ${topbar('Mes mots-clés', 'Formulations personnalisées', false)}
    <div class="screen active">
      <div class="scroll">
        ${syncBadge}
        <div class="hint" style="margin-bottom:14px;">
          Pour chaque point, ajoutez vos propres façons de le dire (séparées par des virgules).
          Elles s'ajoutent aux formulations par défaut et sont prioritaires lors de la reconnaissance.
          ${FIREBASE_ENABLED ? '' : ' Pour que ces formulations soient visibles par tous les évaluateurs, activez la synchronisation (voir la note en haut du fichier index.html).'}
        </div>
        ${sectionKwHtml('SÉCURITÉ', SEC_ITEMS)}
        ${sectionKwHtml('QUALITÉ', QUAL_ITEMS)}
        ${sectionKwHtml('ENVIRONNEMENT', ENV_ITEMS)}
      </div>
      <div class="bottom-bar">
        <button class="btn btn-secondary" onclick="cancelKeywords()">Annuler</button>
        <button class="btn btn-primary" onclick="saveKeywords()">Enregistrer</button>
      </div>
    </div>
  `;
}
function sectionKwHtml(title, items){
  return `<div class="section-title"><div class="sw" style="background:var(--accent)"></div><h3>${title}</h3></div>` +
    items.map(([n,label])=>{
      const defaults = (ITEM_KEYWORDS[n]||[]).join(' · ');
      return `<div class="kw-row">
        <div class="kw-row-top"><div class="n">${n}</div><div class="label">${label}</div></div>
        <div class="kw-default">Par défaut : ${defaults}</div>
        <div class="kw-input-row">
          <input id="kw_${n}" placeholder="Vos formulations, séparées par des virgules" value="${escAttr(kwDraft[n]||'')}" oninput="kwDraft[${n}]=this.value">
          <button class="mic-inline" id="mic_kw_${n}" onclick="dictateKeyword(${n})">🎤</button>
        </div>
      </div>`;
    }).join('');
}
function dictateKeyword(n){
  if(!SR){ toast('Dictée vocale indisponible — saisissez au clavier.'); return; }
  const el = document.getElementById('kw_'+n);
  const btn = document.getElementById('mic_kw_'+n);
  const launch = ()=>{
    const r = new SR();
    r.lang='fr-FR'; r.continuous=false; r.interimResults=true;
    if(btn) btn.classList.add('on');
    r.onresult = (ev)=>{
      let t=''; for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
      el.value = t; kwDraft[n]=t;
    };
    r.onerror = (e)=>{
      if(btn) btn.classList.remove('on');
      if(e.error==='network') toast('Pas de connexion internet : la dictée est indisponible.');
      else if(e.error==='not-allowed') toast("Micro refusé — autorisez l'accès au micro.");
    };
    r.onend = ()=>{ if(btn) btn.classList.remove('on'); vibrate(20); };
    try{ r.start(); }catch(e){ setTimeout(()=>{ try{ r.start(); }catch(e2){ toast('Micro occupé, réessayez.'); } }, 300); }
  };
  if(listening){ listeningIntended=false; try{ recognizer && recognizer.stop(); }catch(e){} setMicUI(false); setTimeout(launch,250); }
  else launch();
}
function cancelKeywords(){ kwDraft = null; goTo(screenBeforeKeywords); }
async function saveKeywords(){
  // nettoie les entrées vides
  const cleaned = {};
  Object.keys(kwDraft).forEach(k=>{ if(kwDraft[k] && kwDraft[k].trim()) cleaned[k]=kwDraft[k].trim(); });
  customKeywords = cleaned;
  await store.set('settings:keywords', customKeywords); // cache local, disponible immédiatement même hors-ligne
  kwDraft = null;
  if(FIREBASE_ENABLED && fbDB){
    try{
      await withTimeout(fbDB.ref('keywords').set(cleaned), 5000);
      toast("Enregistré et partagé avec toute l'équipe.");
    }catch(e){
      toast('Enregistré sur cet appareil — la synchronisation en ligne a échoué (vérifiez la connexion), elle réessaiera plus tard.');
    }
  } else {
    toast('Vos formulations sont enregistrées sur cet appareil.');
  }
  goTo(screenBeforeKeywords);
}
function openKeywords(){ screenBeforeKeywords = currentScreen; kwDraft = {...customKeywords}; goTo('keywords'); }

/* ---------- Barre supérieure commune ---------- */
function topbar(title, sub, showProgress){
  const offline = !navigator.onLine;
  return `<div class="topbar">
    <button class="icon-btn" onclick="handleBack()">‹</button>
    <div style="flex:1;">
      <div class="title">${title}</div>
      ${sub?`<div class="sub">${sub}${offline?' · <span style="color:var(--warn); font-weight:700;">● hors ligne</span>':''}</div>`:(offline?`<div class="sub" style="color:var(--warn); font-weight:700;">● hors ligne</div>`:'')}
    </div>
    ${currentScreen!=='home'?`<button class="icon-btn" onclick="goTo('home')" title="Accueil">⌂</button>`:''}
  </div>
  ${showProgress? `<div class="progress-track"><div class="progress-fill" style="width:${progressPct()}%"></div></div>` : ''}`;
}
function handleBack(){
  const idx = SCREEN_ORDER.indexOf(currentScreen);
  if(currentScreen==='history'){ goTo('home'); return; }
  if(idx<=0){ goTo('home'); return; }
  goTo(SCREEN_ORDER[idx-1]);
}

/* ---------- Connectivité ---------- */
window.addEventListener('online', ()=>{ toast('Connexion rétablie.'); render(); });
window.addEventListener('offline', ()=>{
  toast('Hors connexion — le vocal continu est indisponible. Utilisez la grille tactile.', 3500);
  if(listening){ listeningIntended=false; try{ recognizer && recognizer.stop(); }catch(e){} setMicUI(false); }
  render();
});

/* ---------- Démarrage ---------- */
loadCustomKeywords().then(()=>goTo('home'));
